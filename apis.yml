aid: felmo
name: Felmo
description: >-
  felmo (felmo GmbH) is a mobile veterinary practice (mobile Tierarztpraxis)
  headquartered in Berlin, Germany that brings licensed veterinarians directly to
  pet owners' homes for dogs and cats. Founded in 2019 by CEO Philip Trockels, felmo
  operates across Berlin, Hamburg, Munich, Cologne, Frankfurt, Stuttgart, Düsseldorf
  and 25+ additional German cities, and has treated 300,000+ animals with 8,000+ home
  visits per month via 140+ mobile vets. Services include preventive care and
  consultations, examinations and diagnostics, laboratory and imaging, surgical
  procedures (including a fully-equipped mobile operating vehicle / OP-Wagen), dental
  medicine and holistic pet care, billed per the German veterinary fee schedule (GOT).
  Customers book appointments, access medical records and lab results, receive
  reminders, and message support through the felmo iOS and Android app. felmo is
  backed by HV Capital and additional venture investors. No public developer API or
  documentation surface was found during enrichment; this profile captures the
  company's public identity and web properties.
